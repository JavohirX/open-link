<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLink</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <div>
          <h1 class="brand-title">OpenLink</h1>
          <span class="brand-subtitle">Profile &amp; Authwall Guard</span>
        </div>
      </div>
      <label class="toggle-switch" title="Toggle Extension">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Status Banner -->
    <div id="status-bar" class="status-bar status-active">
      <span class="status-dot"></span>
      <span id="status-text">Active &amp; Guarding</span>
    </div>

    <!-- Metrics -->
    <div class="metrics-grid">
      <div class="metric-card">
        <span class="metric-value" id="stat-restored">0</span>
        <span class="metric-label">Profiles Restored</span>
      </div>
      <div class="metric-card">
        <span class="metric-value" id="stat-loops">0</span>
        <span class="metric-label">Loops Prevented</span>
      </div>
    </div>

    <!-- Active Tab Status -->
    <div class="section-card tab-status-card">
      <div class="card-header">
        <span class="card-title">Active Tab Status</span>
        <span id="tab-badge" class="badge badge-neutral">Idle</span>
      </div>
      <div id="tab-info" class="tab-info-text">No LinkedIn activity detected on current tab.</div>
    </div>

    <!-- Settings Accordion -->
    <details class="settings-details">
      <summary class="settings-summary">
        <span>Settings &amp; Thresholds</span>
        <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </summary>
      <div class="settings-content">
        <label class="setting-item">
          <span>Max restorations before loop guard</span>
          <select id="setting-max-attempts">
            <option value="1">1 attempt (Default - recommended)</option>
            <option value="2">2 attempts</option>
          </select>
        </label>
        <label class="setting-item">
          <span>Loop sliding window</span>
          <select id="setting-window-sec">
            <option value="15">15 seconds</option>
            <option value="30" selected>30 seconds (Default)</option>
            <option value="60">60 seconds</option>
          </select>
        </label>
        <label class="setting-item checkbox-item">
          <input type="checkbox" id="setting-dismiss-modals" checked>
          <span>Auto-dismiss profile sign-in popups</span>
        </label>
      </div>
    </details>

    <!-- Recent Activity -->
    <div class="section-card activity-card">
      <div class="card-header">
        <span class="card-title">Recent Interceptions</span>
        <button id="btn-clear-logs" class="btn-text">Clear</button>
      </div>
      <div id="activity-list" class="activity-list">
        <div class="empty-state">No interceptions recorded yet.</div>
      </div>
    </div>

    <!-- Footer & Privacy Notice -->
    <footer class="footer">
      <div class="privacy-note">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>100% Local processing. Zero external data transmission.</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
